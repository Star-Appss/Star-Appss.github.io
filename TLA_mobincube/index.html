<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BibliaNVI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-player {
            position: relative;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background-color: #000;
        }

        .floating-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 2, 0, 0.70);
            backdrop-filter: blur(10px) saturate(180%);
            -webkit-backdrop-filter: blur(10px) saturate(180%);
            border: 1px solid rgba(0, 255, 0, 0.4);
            border-radius: 50px;
            padding: 14px 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 255, 0, 0.3);
        }

        .floating-btn:hover {
            background: rgba(0, 255, 0, 0.35);
            border-color: rgba(0, 255, 0, 0.6);
            box-shadow: 0 12px 40px rgba(0, 255, 0, 0.5);
            transform: translateX(-50%) scale(1.05);
        }

        .floating-btn:active {
            transform: translateX(-50%) scale(0.97);
        }

        .btn-text {
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            text-decoration: none;
            white-space: nowrap;
            text-shadow:
                0 0 5px rgba(255, 255, 255, 0.7),
                0 0 10px rgba(255, 255, 255, 0.5),
                0 0 20px rgba(255, 255, 255, 0.3),
                2px 2px 0px rgba(0, 0, 0, 0.5),
                -2px -2px 0px rgba(0, 255, 0, 0.3);
            filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.7));
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .btn-icon {
            margin-left: 8px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <video class="video-player" autoplay muted playsinline webkit-playsinline>
            <source src="0830.mp4" type="video/mp4">
            Tu dispositivo no soporta la reproducción de video.
        </video>
        <button class="floating-btn" onclick="window.location.href='https://play.google.com/store/apps/details?id=com.biblia.Lenguaje_Actual_interconfecional_TLAi'">
            <span class="btn-text">Actualizar</span>
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var video = document.querySelector('.video-player');
            video.play().catch(e => console.log('Autoplay prevented:', e));

            window.addEventListener('resize', function() {
                video.style.width = window.innerWidth + 'px';
                video.style.height = window.innerHeight + 'px';
            });
        });
    </script>
</body>
</html>
